<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4"/>
      <stop offset="40%" stop-color="#fd1d1d"/>
      <stop offset="100%" stop-color="#fcb045"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g)"/>
  <!-- Instagram camera outline -->
  <circle cx="300" cy="160" r="72" fill="rgba(255,255,255,0.12)"/>
  <!-- Camera body -->
  <rect x="258" y="128" width="84" height="68" rx="14" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="5"/>
  <!-- Lens -->
  <circle cx="300" cy="162" r="22" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="5"/>
  <!-- Dot top-right -->
  <circle cx="330" cy="136" r="5" fill="rgba(255,255,255,0.75)"/>
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="rgba(255,255,255,0.95)" text-anchor="middle">Instagram</text>
  <text x="300" y="323" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)" text-anchor="middle">Síguenos en Instagram</text>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.55)" text-anchor="middle">@adarugoma</text>
</svg>
